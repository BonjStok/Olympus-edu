name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, types, unit/UI tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and validate content
        run: pnpm compile-content

      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Check formatting
        run: pnpm format:check

      - name: Check documentation links
        run: node scripts/check-doc-links.mjs

      - name: Type check
        run: pnpm typecheck

      - name: Unit and UI tests with coverage
        run: pnpm exec vitest run --project unit --project ui --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-ui
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Production build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  integration:
    name: Integration tests (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: olympus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d olympus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/olympus_ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and validate content
        run: pnpm compile-content

      - name: Integration tests
        run: pnpm test:integration

  docker-e2e:
    name: Docker build budget, API smoke, E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OLYMPUS_PORT: "3000"
      ADMIN_PASSWORD: ci-admin-password
      TEST_API_USERNAME: test_user
      TEST_API_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env from the example
        run: |
          cp .env.example .env
          sed -i "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=${ADMIN_PASSWORD}/" .env
          sed -i "s/^TEST_API_PASSWORD=.*/TEST_API_PASSWORD=${TEST_API_PASSWORD}/" .env

      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.production.yaml config --quiet

      # The hackathon budget (5 minutes) excludes the first download of base images.
      - name: Pre-pull base images
        run: |
          docker pull node:22-bookworm-slim
          docker pull postgres:17-alpine

      - name: Build all images from scratch within 5 minutes
        run: |
          start=$(date +%s)
          docker compose --progress=plain build --no-cache
          elapsed=$(( $(date +%s) - start ))
          echo "Docker build from scratch: ${elapsed}s (budget 300s)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt 300 ]; then
            echo "::error::Docker build took ${elapsed}s, the budget is 300s"
            exit 1
          fi

      - name: Start the stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 240

      - name: API smoke test (DATA-API scenario)
        env:
          API_BASE_URL: http://localhost:3000
        run: node scripts/api-smoke.mjs

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (mobile and desktop)
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: pnpm test:e2e

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  publish:
    name: Publish images to GHCR
    needs: [quality, integration, docker-e2e, workflows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image names
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/olympus-edu" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-web:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./runner
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-runner:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-runner:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      - name: Summary
        run: |
          {
            echo "### Published images"
            echo "- \`${IMAGE_PREFIX}-web:${GITHUB_SHA}\`"
            echo "- \`${IMAGE_PREFIX}-runner:${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
